name: Deploy DropShare

# Every push to main is tested on Linux (NFR-COMPAT-06), then deployed to the Windows server
# (requirements OQ-50). Runbook: docs/deploy/windows-docker.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dropshare-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dropshare_test
          POSTGRES_USER: dropshare
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dropshare -d dropshare_test"
          --health-interval 5s --health-timeout 4s --health-retries 20
    env:
      TEST_DB_DIALECT: postgresql
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: dropshare_test
      TEST_DB_USER: dropshare
      TEST_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      # Client tests need a Qt display and run on the developer machines (CLAUDE.md §2). The
      # pytest-qt plugin would still import Qt at startup, which needs libEGL the runner lacks.
      - run: uv run pytest -p no:pytest-qt shared/tests server/tests

  deploy:
    needs: test
    # Only main deploys. This guards against a manual run on another branch by mistake; the real
    # protection is the environment's branch rule (runbook, "Locking down GitHub").
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, dropshare]
    environment: dropshare-production
    defaults:
      run:
        shell: pwsh
    env:
      DROPSHARE_POSTGRES_PASSWORD: ${{ secrets.DROPSHARE_POSTGRES_PASSWORD }}
      DROPSHARE_TOKEN_SECRET: ${{ secrets.DROPSHARE_TOKEN_SECRET }}
      DROPSHARE_EMAIL_API_KEY: ${{ secrets.DROPSHARE_EMAIL_API_KEY }}
      DROPSHARE_EMAIL_API_URL: ${{ vars.DROPSHARE_EMAIL_API_URL }}
      DROPSHARE_POSTGRES_USER: ${{ vars.DROPSHARE_POSTGRES_USER || 'dropshare' }}
      DROPSHARE_POSTGRES_DB: ${{ vars.DROPSHARE_POSTGRES_DB || 'dropshare' }}
      DROPSHARE_STORAGE_PATH: ${{ vars.DROPSHARE_STORAGE_PATH || 'E:\DropShareData' }}
      DROPSHARE_API_BIND: ${{ vars.DROPSHARE_API_BIND }}
      DROPSHARE_TRUSTED_PROXIES: ${{ vars.DROPSHARE_TRUSTED_PROXIES }}
      DROPSHARE_RELEASE_PUBLISHER: ${{ vars.DROPSHARE_RELEASE_PUBLISHER }}
      DROPSHARE_RELEASE_CERT_SHA256: ${{ vars.DROPSHARE_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check secrets and storage folder
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'DROPSHARE_POSTGRES_PASSWORD', 'DROPSHARE_TOKEN_SECRET') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing secret $name" }
          }
          if (-not (Test-Path -PathType Container $env:DROPSHARE_STORAGE_PATH)) {
            throw "Storage folder $env:DROPSHARE_STORAGE_PATH doesn't exist (see the runbook)"
          }

      - name: Build and start the stack
        run: |
          # ClamAV is started without waiting for it: its first start downloads and loads the
          # signatures, which can take longer than the other services' wait (runbook step 8).
          # Uploads wait meanwhile and finish once it answers (OQ-55).
          & docker compose up -d --remove-orphans clamav
          if (-not $LASTEXITCODE) {
            & docker compose up -d --build --remove-orphans --wait --wait-timeout 240 postgres api jobs scanner watchdog
          }
          if ($LASTEXITCODE) {
            & docker compose ps -a
            & docker compose logs --tail 100 api jobs scanner clamav
            throw 'Deploy failed'
          }

      - name: Readiness check (database, storage and malware scanner)
        run: |
          # The API listens only on DROPSHARE_API_BIND once that is set, not on loopback.
          $apiHost = if ($env:DROPSHARE_API_BIND) { $env:DROPSHARE_API_BIND } else { '127.0.0.1' }
          # Up to 20 minutes: the scanner is ready only once ClamAV has its signatures.
          $deadline = (Get-Date).AddMinutes(20)
          while ($true) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri "http://${apiHost}:5009/health/ready" -TimeoutSec 10 | Out-Null
              break
            } catch {
              if ((Get-Date) -gt $deadline) {
                & docker compose ps -a
                & docker compose logs --tail 100 api scanner clamav
                throw "Not ready after 20 minutes: $($_.ErrorDetails.Message)"
              }
              Start-Sleep -Seconds 15
            }
          }
          # On its first start clamd can load the signatures bundled in the image while freshclam
          # is downloading newer ones, and freshclam's notice then misses it. Reloading once
          # it is up makes it use what freshclam fetched (clamd keeps scanning meanwhile).
          & docker compose exec -T clamav clamdscan --reload
