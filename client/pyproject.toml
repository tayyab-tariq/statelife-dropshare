[project]
name = "dropshare-client"
version = "0.1.0"
description = "StateLife DropShare desktop client"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dropshare-shared",
    "httpx>=0.27",
    "keyring>=25",
    "pyside6>=6.8",
    "sqlalchemy>=2.0.36",
    "watchdog>=5",
]

[tool.uv.sources]
dropshare-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
