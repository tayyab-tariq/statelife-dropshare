# clamd for DropShare's malware scan of uploads (FR-SAFE-01, OQ-57 (7), OQ-58).
# Mounted over the image's /etc/clamav/clamd.conf by docker-compose.yml and the dev setup
# (docs/clamav-setup.md). Signatures are kept current by freshclam in the same container.

# The image's start script runs clamd in the foreground; with no LogFile it logs to the
# container's output. Never as root.
User clamav
LogTime yes
DatabaseDirectory /var/lib/clamav

# Only the API and the scan worker reach it, over the private Docker network (no published port
# in production).
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock

# Every allowed file is scanned in full (NFR-SCALE-01: 2,000 MiB). clamd scans at most 2 GiB - 1
# of a single file whatever MaxFileSize says, which is why DropShare's limit is below it
# (OQ-58 (4)). Anything over a limit is reported as Heuristics.Limits.Exceeded, which DropShare
# refuses rather than accepting unscanned (OQ-58 (2)).
StreamMaxLength 4000M
MaxFileSize 4000M
# Archives: up to 4000M unpacked in total, 100,000 files (clamd's default is 10,000, which
# refuses ordinary large archives) and clamd's default nesting of 17 levels.
MaxScanSize 4000M
MaxFiles 100000
AlertExceedsMax yes
# Scanning the largest file takes a few minutes; the default of 2 minutes would refuse it as
# Heuristics.Limits.Exceeded.MaxScanTime. 14 minutes: just under the scan worker's 15-minute wait
# (CLAMD_REPLY_TIMEOUT_SECONDS), so clamd always answers first.
MaxScanTime 840000

# A 2 GB stream arrives over the network before the scan starts; give it time.
ReadTimeout 600
CommandReadTimeout 30
# The worker's long scans and the API's short ones run side by side.
MaxThreads 8
MaxQueue 200
