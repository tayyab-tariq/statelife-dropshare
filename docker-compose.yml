# Production stack on the Windows server with Docker Desktop (requirements OQ-50).
# Runbook: docs/deploy/windows-docker.md. Values come from the environment of whoever runs
# `docker compose` (the deploy workflow sets them from GitHub secrets and variables).
name: dropshare

x-logging: &default-logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

# The API and the jobs runner share one image and one configuration.
x-app: &app
  image: dropshare/api:production
  restart: unless-stopped
  init: true
  environment:
    DB_DIALECT: postgresql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: ${DROPSHARE_POSTGRES_DB:-dropshare}
    DB_USER: ${DROPSHARE_POSTGRES_USER:-dropshare}
    DB_PASSWORD: ${DROPSHARE_POSTGRES_PASSWORD:?set DROPSHARE_POSTGRES_PASSWORD}
    TOKEN_SECRET: ${DROPSHARE_TOKEN_SECRET:?set DROPSHARE_TOKEN_SECRET}
    STORAGE_LOCAL_ROOT: /data
    # JSON lists, e.g. ["192.0.2.10"]. Empty until the proxy's address is known.
    TRUSTED_PROXIES: ${DROPSHARE_TRUSTED_PROXIES:-[]}
    RELEASE_PUBLISHER: ${DROPSHARE_RELEASE_PUBLISHER:-}
    RELEASE_CERT_SHA256: ${DROPSHARE_RELEASE_CERT_SHA256:-[]}
    # Email API for temporary passwords (FR-ADMIN-07): both or neither. Empty means admins
    # pass the password on themselves.
    EMAIL_API_URL: ${DROPSHARE_EMAIL_API_URL:-}
    EMAIL_API_KEY: ${DROPSHARE_EMAIL_API_KEY:-}
    # Malware scanner (FR-SAFE-01). While it can't be reached, uploads wait (OQ-55).
    CLAMD_HOST: clamav
  volumes:
    # Users' files. A Windows folder, not a Docker volume: the host's `releases publish` writes
    # here too, and it survives a Docker Desktop reset. Never created by Docker: a missing folder
    # must stop the deploy, not start on an empty one.
    - type: bind
      source: ${DROPSHARE_STORAGE_PATH:-E:\DropShareData}
      target: /data
      bind:
        create_host_path: false
  depends_on:
    postgres: { condition: service_healthy }
  networks: [dropshare-private, dropshare-scan]
  logging: *default-logging
  security_opt: [no-new-privileges:true]

services:
  # No selfheal label: after a crash PostgreSQL replays its WAL before it answers health checks,
  # and a restart in the middle would start the replay over.
  postgres:
    image: postgres:16-alpine
    init: true
    restart: unless-stopped
    # Defaults suit a metadata-only database (file content is in the storage folder). No
    # idle-in-transaction timeout: completing an upload holds its transaction while the whole file
    # (up to 2,000 MiB) is assembled and hashed.
    command:
      - postgres
      - -c
      - log_lock_waits=on
    # Docker's default of 64 MB is too small for parallel queries.
    shm_size: 1gb
    # Docker's default 10 s can cut a shutdown short and force crash recovery on the next start.
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${DROPSHARE_POSTGRES_DB:-dropshare}
      POSTGRES_USER: ${DROPSHARE_POSTGRES_USER:-dropshare}
      # Only read when the volume is first created; changing it later needs ALTER USER.
      POSTGRES_PASSWORD: ${DROPSHARE_POSTGRES_PASSWORD:?set DROPSHARE_POSTGRES_PASSWORD}
    volumes:
      - dropshare-postgres:/var/lib/postgresql/data
    # Loopback only: for the host's admin CLI (`releases publish` runs on Windows, OQ-48).
    ports:
      - "127.0.0.1:${DROPSHARE_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 4s
      retries: 20
    networks: [dropshare-private]
    mem_limit: 4g
    logging: *default-logging
    security_opt: [no-new-privileges:true]

  api:
    <<: *app
    build:
      context: .
      dockerfile: server/Dockerfile
    # Plain HTTP. Loopback only until the Windows firewall allows port 5009 from the proxy alone;
    # then DROPSHARE_API_BIND is set to the server's address (runbook, NFR-SEC-01).
    ports:
      - "${DROPSHARE_API_BIND:-127.0.0.1}:5009:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    mem_limit: 2g
    labels:
      dropshare.selfheal: "true"        # the watchdog restarts it when unhealthy

  # Cleanup jobs (NFR-REL-05, OQ-38): once at start, then every JOBS_INTERVAL_SECONDS.
  jobs:
    <<: *app
    pull_policy: never                   # the image is built by the api service
    depends_on:
      api: { condition: service_healthy }   # the API has run the migrations
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          for job in expire-uploads purge-trash gc-blobs purge-audit; do
            dropshare-server jobs run "$$job" || echo "Job $$job failed" >&2
          done
          sleep "$${JOBS_INTERVAL_SECONDS:-86400}"
        done
    networks: [dropshare-private]        # never talks to the scanner
    mem_limit: 512m

  # The scan worker (FR-SAFE-01): finishes uploads too large to scan within a request, and ones
  # sent while clamav was down.
  scanner:
    <<: *app
    pull_policy: never                   # the image is built by the api service
    depends_on:
      api: { condition: service_healthy }   # the API has run the migrations
    command: ["dropshare-server", "jobs", "run", "scan-uploads", "--loop"]
    mem_limit: 512m

  # ClamAV (OQ-57 (7)): clamd plus freshclam, which keeps the signatures current. GPL, run as a
  # separate service and never linked into our code. Private network only, no published port.
  # Needs outbound HTTPS to database.clamav.net. The first start downloads the signatures for a
  # few minutes; until then uploads wait and /health/ready reports the scanner as failed.
  clamav:
    # The LTS line (supported to Aug 2027). The Debian build: also runs on the Macs used for
    # development (arm64), which the Alpine-based clamav/clamav image doesn't.
    image: clamav/clamav-debian:1.4.6
    restart: unless-stopped
    environment:
      # Look for new signatures every 2 hours (the image's default is once a day). ClamAV asks
      # for no more than once an hour.
      FRESHCLAM_CHECKS: "12"
    volumes:
      - dropshare-clamav:/var/lib/clamav
      - type: bind
        source: ./deploy/clamav/clamd.conf
        target: /etc/clamav/clamd.conf
        read_only: true
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m
    # clamd parses untrusted files: its own network, shared only with the API and the scanner,
    # never with the database. Not internal: freshclam needs the internet.
    networks: [dropshare-scan]
    # Only what its start script needs: hand the signatures to the clamav user, then drop to it.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    # Signatures take about 1.5 GB, briefly twice that while freshclam reloads them.
    mem_limit: 4g
    logging: *default-logging
    security_opt: [no-new-privileges:true]

  watchdog:
    image: dropshare/watchdog:production
    build:
      context: .
      dockerfile: deploy/watchdog/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    network_mode: none
    environment:
      WATCHDOG_PROJECT: dropshare       # must match `name:` at the top
      WATCHDOG_LABEL: dropshare.selfheal=true
      WATCHDOG_INTERVAL_SECONDS: "10"
      WATCHDOG_RESTART_GRACE_SECONDS: "30"
      WATCHDOG_RESTART_COOLDOWN_SECONDS: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    mem_limit: 256m
    logging: *default-logging
    security_opt: [no-new-privileges:true]

volumes:
  dropshare-postgres:
  dropshare-clamav:

networks:
  dropshare-private:
    driver: bridge
  # The malware scanner's own network (FR-SAFE-01): the API, the scanner and clamav.
  dropshare-scan:
    driver: bridge
